name: Build Sapiens Chunks

on:
  push:
    branches: [main]
    paths-ignore:
      - "aigar-c-2/biblioteca/Sapiens/**"

permissions:
  contents: write

jobs:
  build-sapiens:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install PyPDF2

      - name: Build chunks
        run: |
          python -m AIGAR_LIBRARY_BUILDER.build \
            --input "aigar-c-2/biblioteca/Sapiens uma Breve História da Humanidade - Yuval Noah Harari.pdf" \
            --library "Sapiens" \
            --output "aigar-c-2/biblioteca" \
            --pages 25

      - name: Commit generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "aigar-c-2/biblioteca/Sapiens"
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: generate Sapiens library chunks"
          git push
