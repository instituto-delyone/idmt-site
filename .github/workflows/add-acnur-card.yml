name: Add ACNUR donation card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    if: ${{ !contains(github.event.head_commit.message, 'feat: add ACNUR donation card') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ACNUR card
        env:
          ACNUR_LOGO_B64: PLACEHOLDER_LOGO
          PATCH_SCRIPT_B64: PLACEHOLDER_SCRIPT
        run: |
          echo "$PATCH_SCRIPT_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit site change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/assets/acnur-card.jpg
          git commit -m "feat: add ACNUR donation card"
          rm -f .github/workflows/add-acnur-card.yml
          git add .github/workflows/add-acnur-card.yml
          git commit -m "chore: remove temporary ACNUR workflow"
          git push
