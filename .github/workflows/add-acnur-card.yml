name: Add ACNUR donation card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    if: ${{ !contains(github.event.head_commit.message, 'feat: add ACNUR donation card') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add ACNUR card
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request

          path = Path('docs/index.html')
          s = path.read_text(encoding='utf-8')

          css_marker = '    .brazil-seal{\n'
          css = '''    .acnur-side-space{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .acnur-donate{
      width:150px;
      min-height:120px;
      border:1px solid rgba(140,211,247,.16);
      border-radius:13px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:7px;
      padding:9px;
      background:rgba(255,255,255,.025);
      transition:.2s;
      text-align:center;
    }
    .acnur-donate:hover{
      transform:translateY(-2px);
      border-color:rgba(103,217,255,.36);
      background:rgba(71,179,241,.07);
    }
    .acnur-donate img{
      display:block;
      width:82px;
      height:70px;
      object-fit:contain;
      border-radius:5px;
    }
    .acnur-donate strong{font-size:11px;color:#d9f2ff}
    .acnur-donate small{display:block;color:#9db8ce;font-size:8px;line-height:1.25}

'''
          if '.acnur-donate' not in s:
              if css_marker not in s:
                  raise SystemExit('CSS insertion point not found')
              s = s.replace(css_marker, css + css_marker, 1)

          mobile_old = '''      .partner-layout{grid-template-columns:1fr}
      .partner-side-space{display:none}
      .partner-stage{width:min(540px,100%)}'''
          mobile_new = '''      .partner-layout{grid-template-columns:1fr}
      .partner-side-space{display:none}
      .partner-side-space.acnur-side-space{display:flex;min-height:145px}
      .partner-stage{width:min(540px,100%)}'''
          if 'partner-side-space.acnur-side-space' not in s:
              if mobile_old not in s:
                  raise SystemExit('Mobile insertion point not found')
              s = s.replace(mobile_old, mobile_new, 1)

          html_old = '''        <div class="partner-side-space" aria-hidden="true"></div>
      </div>'''
          html_new = '''        <div class="partner-side-space acnur-side-space">
          <a class="acnur-donate" href="https://doar.acnur.org/br/pt-br/general" target="_blank" rel="noopener" aria-label="Doar para o ACNUR">
            <img src="/assets/acnur-card.jpg" alt="ACNUR — Agência da ONU para Refugiados">
            <strong>Doe · Ajude doando</strong>
            <small>Contribua diretamente com o ACNUR.</small>
          </a>
        </div>
      </div>'''
          if 'href="https://doar.acnur.org/br/pt-br/general"' not in s:
              if html_old not in s:
                  raise SystemExit('HTML insertion point not found')
              s = s.replace(html_old, html_new, 1)

          path.write_text(s, encoding='utf-8')
          urllib.request.urlretrieve(
              'https://upload.wikimedia.org/wikipedia/de/thumb/5/5c/UNHCR_Logo.svg/220px-UNHCR_Logo.svg.png',
              'docs/assets/acnur-card.jpg'
          )
          PY

      - name: Commit site change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/assets/acnur-card.jpg
          git commit -m "feat: add ACNUR donation card"
          rm -f .github/workflows/add-acnur-card.yml
          git add .github/workflows/add-acnur-card.yml
          git commit -m "chore: remove temporary ACNUR workflow"
          git push
