name: AIGAR Neurocognitive Runtime validation

on:
  pull_request:
    paths:
      - "aigar-c-2/AIGAR_RUNTIME/**"
      - "aigar-c-2/AIGAR_LANGUAGE/**"
      - "aigar-c-2/AIGAR_LIBRARY/**"
      - "aigar-c-2/AIGAR_LIBRARY_BUILDER/**"
      - ".github/workflows/aigar-runtime-validation.yml"

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        working-directory: aigar-c-2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AIGAR_RUNTIME/requirements.txt pytest

      - name: Compile runtime and language modules
        working-directory: aigar-c-2
        run: |
          python -m compileall -q AIGAR_RUNTIME AIGAR_LANGUAGE AIGAR_LIBRARY

      - name: Run runtime regression tests
        working-directory: aigar-c-2
        run: python -m pytest -q AIGAR_RUNTIME/test_runtime.py AIGAR_LANGUAGE/test_interpreter.py AIGAR_LIBRARY/tests/test_retriever.py
