name: AIGAR Neurocognitive Runtime validation

on:
  pull_request:
    paths:
      - "aigar-c-2/AIGAR_RUNTIME/**"
      - "aigar-c-2/language_network/**"
      - "aigar-c-2/knowledge_retrieval/**"
      - "aigar-c-2/knowledge_consolidation/**"
      - ".github/workflows/aigar-runtime-validation.yml"

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        working-directory: aigar-c-2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AIGAR_RUNTIME/requirements.txt pytest

      - name: Compile runtime and language modules
        working-directory: aigar-c-2
        run: |
          python -m compileall -q AIGAR_RUNTIME language_network knowledge_retrieval

      - name: Run runtime regression tests
        working-directory: aigar-c-2
        env:
          PYTHONPATH: AIGAR_RUNTIME:language_network:knowledge_retrieval
        run: python -m pytest -q AIGAR_RUNTIME/test_runtime.py language_network/test_interpreter.py knowledge_retrieval/tests/test_retriever.py
