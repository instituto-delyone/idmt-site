name: AIGAR UI validation

on:
  pull_request:
    paths:
      - "aigar-c-2/aigar_ui_chat_mvp/**"
      - ".github/workflows/aigar-backend-validation.yml"
  push:
    branches:
      - main
    paths:
      - "aigar-c-2/aigar_ui_chat_mvp/**"
      - ".github/workflows/aigar-backend-validation.yml"

permissions:
  contents: read

jobs:
  ui-chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aigar-c-2/aigar_ui_chat_mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile UI and module sources
        run: python -m compileall -q server
