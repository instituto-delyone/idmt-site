<!DOCTYPE html>
  <p class="list-note">Apresente uma questão clínica de forma objetiva. A discussão poderá evoluir para uma pergunta de pesquisa.</p>
  <form id="discussionForm">
    <div class="fields two">
      <input name="author_name" maxlength="100" placeholder="Seu nome" required>
      <input name="title" maxlength="180" placeholder="Título da discussão" required>
    </div>
    <div class="fields" style="margin-top:9px">
      <select name="category" required><option value="">Categoria</option><option>Clínica</option><option>Diagnóstico</option><option>Terapêutica</option><option>Evidências</option><option>Educação médica</option><option>Perguntas de pesquisa</option></select>
      <textarea name="question" maxlength="1200" placeholder="Qual é a pergunta clínica?" required></textarea>
      <textarea name="context" maxlength="4000" placeholder="Contexto (opcional)"></textarea>
      <textarea name="content" maxlength="8000" placeholder="Apresente sua discussão, experiência ou ponto de partida (opcional)"></textarea>
      <button class="primary" type="submit">Publicar discussão</button>
      <div class="status" id="discussionStatus"></div>
    </div>
  </form>
</section>
</main>
<footer class="footer">© 2026 Instituto Delyone de Medicina e Tecnologia</footer>
</div>
<script>
// A URL pode ser redefinida futuramente por window.FORUM_API_BASE sem alterar a interface.
const API_BASE = window.FORUM_API_BASE || "https://idmt-forum-api.dr-delyone.workers.dev";
const categories = ["Todas","Clínica","Diagnóstico","Terapêutica","Evidências","Educação médica","Perguntas de pesquisa"];
let selectedCategory = "Todas";
let discussions = [];
let selectedId = null;


const $ = (id) => document.getElementById(id);


function esc(value){return String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));}
function date(value){try{return new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeStyle:"short"}).format(new Date(value));}catch{return value;}}
async function api(path, options={}){
  const headers = new Headers(options.headers);
  if(options.body && !headers.has("Content-Type")) headers.set("Content-Type","text/plain;charset=UTF-8");
  const response = await fetch(API_BASE + path, {...options,headers});
  const data = await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data.error || "Não foi possível concluir a operação.");
  return data;
}


function renderCategories(){
  $("categoryTabs").innerHTML = categories.map(c => `<button class="tab ${c===selectedCategory?"active":""}" data-category="${esc(c)}">${esc(c)}</button>`).join("");
  document.querySelectorAll("[data-category]").forEach(btn=>btn.addEventListener("click",()=>{selectedCategory=btn.dataset.category;renderCategories();loadDiscussions();}));
}


function renderList(){
  const list = $("discussionList");
  if(!discussions.length){list.innerHTML='<div class="empty">Ainda não há discussões publicadas nesta categoria.</div>';return;}
  list.innerHTML = discussions.map(d=>`<button class="discussion-card ${d.id===selectedId?"active":""}" data-id="${esc(d.id)}"><strong>${esc(d.title)}</strong><small>por ${esc(d.author_name)} · ${esc(date(d.created_at))}</small><span class="category">${esc(d.category)}</span></button>`).join("");
  list.querySelectorAll("[data-id]").forEach(btn=>btn.addEventListener("click",()=>loadDiscussion(btn.dataset.id)));
}


async function loadDiscussions(){
  try{
    const suffix = selectedCategory !== "Todas" ? `?category=${encodeURIComponent(selectedCategory)}` : "";
    const data = await api("/discussions"+suffix);
    discussions = data.discussions || [];
    if(!selectedId || !discussions.some(d=>d.id===selectedId)) selectedId = discussions[0]?.id || null;
    renderList();
    if(selectedId) loadDiscussion(selectedId); else $("discussionView").innerHTML='<div class="empty">Ainda não há discussões. Seja o primeiro a iniciar uma.</div>';
  }catch(error){
    $("discussionList").innerHTML=`<div class="empty">Não foi possível carregar o fórum.<br><br><strong>${esc(error.message)}</strong></div>`;
    $("discussionView").innerHTML='<div class="empty">Não foi possível carregar o conteúdo do fórum. Tente novamente mais tarde.</div>';
  }
}


async function loadDiscussion(id){
  selectedId=id; renderList();
  try{
    const data=await api(`/discussions/${encodeURIComponent(id)}`);
    const d=data.discussion;
    const comments=data.comments||[];
    $("discussionView").innerHTML=`
      <div class="meta">${esc(d.category)} · criada por ${esc(d.author_name)} · ${esc(date(d.created_at))}</div>
      <h2>${esc(d.title)}</h2>
      <div class="question"><strong>Pergunta clínica</strong><div class="body-copy">${esc(d.question)}</div></div>
      ${d.context?`<div class="body-copy"><strong>Contexto</strong><br>${esc(d.context)}</div>`:""}
      ${d.content?`<div class="body-copy" style="margin-top:17px"><strong>Discussão inicial</strong><br>${esc(d.content)}</div>`:""}
      <div class="comments"><h3>${comments.length} ${comments.length===1?"comentário":"comentários"}</h3>
        ${comments.length?comments.map(c=>`<div class="comment"><b>${esc(c.author_name)}</b><time>${esc(date(c.created_at))}</time><p>${esc(c.content)}</p></div>`).join(""): '<div class="empty">Ainda não há comentários. Abra a discussão.</div>'}
