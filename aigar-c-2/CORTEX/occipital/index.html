<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIGAR UI — Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">AIGAR</div>
      <div class="models">
        <label>Módulo ativo</label>
        <select id="moduleSelect"></select>
      </div>
      <div class="cards">
        <label>Memory Cards</label>
        <ul id="cardsList"></ul>
      </div>
      <div class="status" id="status">Conectando...</div>
    </aside>
    <main class="chat">
      <header class="chat-header"><h1>Console</h1></header>
      <div id="messages" class="messages"></div>
      <footer class="composer">
        <input id="promptInput" type="text" placeholder="Digite aqui... (!, /, ~, ——)">
        <button id="sendBtn">Enviar</button>
      </footer>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
